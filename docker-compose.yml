volumes:
  pg_volume:
  gradle_cache:

services:
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    environment:
      - DB_URL=jdbc:postgresql://database:5432/commerceevolutiondb
      - DB_USERNAME=admin
      - DB_PASSWORD=admin
    ports:
      - "8080:8080"
    volumes:
      - gradle_cache:/root/.gradle
      - .:/app:rw
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:18
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=commerceevolutiondb
    ports:
      - "5432:5432"
    volumes:
      - pg_volume:/var/lib/postgresql/18/data
    command: [ "postgres", "-c", "max_connections=200" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-commerceevolutiondb}" ]
      interval: 10s
      timeout: 5s
      retries: 5