volumes:
  pg_volume:
  gradle_cache:
  payment_pg_volume:
  payment_gradle_cache:

services:
  # modular monolith
  server:
    build:
      context: ./modular-monolith
      dockerfile: docker/Dockerfile
      target: dev
    environment:
      - DB_URL=jdbc:postgresql://database:5432/commerceevolutiondb
      - DB_USERNAME=admin
      - DB_PASSWORD=admin
      - INTERNAL_API_KEY=dev-internal-api-key
      - PAYMENT_SERVICE_BASE_URL=http://payment-server:8081
    ports:
      - "8080:8080"
    volumes:
      - gradle_cache:/root/.gradle
      - ./modular-monolith:/app:rw
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:18
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=commerceevolutiondb
    ports:
      - "5432:5432"
    volumes:
      - pg_volume:/var/lib/postgresql/18/data
    command: [ "postgres", "-c", "max_connections=200" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-commerceevolutiondb}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # payment service
  payment-server:
    build:
      context: ./payment-service
      dockerfile: docker/Dockerfile
      target: dev
    environment:
      - DB_URL=jdbc:postgresql://payment-database:5432/paymentdb
      - DB_USERNAME=admin
      - DB_PASSWORD=admin
      - SERVER_PORT=8081
      - INTERNAL_API_KEY=dev-internal-api-key
      - ORDER_SERVICE_BASE_URL=http://server:8080
    ports:
      - "8081:8081"
    volumes:
      - payment_gradle_cache:/root/.gradle
      - ./payment-service:/app:rw
    depends_on:
      payment-database:
        condition: service_healthy

  payment-database:
    image: postgres:18
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=paymentdb
    ports:
      - "5433:5432"
    volumes:
      - payment_pg_volume:/var/lib/postgresql/18/data
    command: [ "postgres", "-c", "max_connections=200" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-paymentdb}" ]
      interval: 10s
      timeout: 5s
      retries: 5
