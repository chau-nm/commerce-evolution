spring:
  application:
    name: commerceevolution
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/commerceevolution}
    username: ${DB_USERNAME:commerceevolution}
    password: ${DB_PASSWORD:commerceevolution}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:this-is-a-demo-only-secret-do-not-use-in-production-1234567890}
    private-key: classpath:jwt/private.pem
    public-key: classpath:jwt/public.pem
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P30D}
